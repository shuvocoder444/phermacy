{% extends "pharmacy/base.html" %}
{% block title %}Sign in · {{ tenant.name }}{% endblock %}
{% block content %}
<main class="mx-auto mt-20 max-w-md rounded-xl bg-white p-8 shadow">
  <h1 class="text-2xl font-bold">Sign in to {{ tenant.name }}</h1>
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full rounded bg-emerald-700 px-4 py-3 font-semibold text-white">Sign in</button>
  </form>
</main>
{% endblock %}

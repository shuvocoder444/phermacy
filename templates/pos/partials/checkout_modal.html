<div class="p-5 sm:p-6 bg-white overflow-y-auto max-h-[88dvh] pb-safe" x-data="{
    paymentMethod: 'CASH',
    totalPayable: {{ cart.total_payable }},
    paidAmount: {{ cart.total_payable }},
    submitting: false,
    get changeAmount() {
        let paid = parseFloat(this.paidAmount) || 0;
        let diff = paid - this.totalPayable;
        return diff > 0 ? diff.toFixed(2) : '0.00';
    },
    get dueAmount() {
        let paid = parseFloat(this.paidAmount) || 0;
        let diff = this.totalPayable - paid;
        return diff > 0 ? diff.toFixed(2) : '0.00';
    }
}">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 sm:pb-4 border-b border-slate-100">
        <div class="flex items-center space-x-2.5 sm:space-x-3">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-emerald-100 text-emerald-700 border border-emerald-200 flex items-center justify-center font-bold text-lg sm:text-xl">
                ৳
            </div>
            <div>
                <h3 class="text-base sm:text-lg font-bold text-slate-800">পেমেন্ট গ্রহণ ও টেন্ডার</h3>
                <p class="text-xs text-slate-500">মোট আইটেম: {{ cart.total_items_count }}টি</p>
            </div>
        </div>
        <div class="text-right">
            <div class="text-[11px] sm:text-xs text-slate-400 uppercase font-semibold">সর্বমোট প্রদেয়</div>
            <div class="text-xl sm:text-2xl font-black text-emerald-600 font-mono">৳{{ cart.total_payable }}</div>
        </div>
    </div>

    <!-- Form with correct Target and CSRF Token -->
    <form 
        hx-post="{% url 'pos:checkout_submit' %}" 
        hx-target="#checkout-modal-content" 
        hx-swap="innerHTML"
        hx-sync="this:drop"
        hx-disabled-elt="find button[type='submit']"
        @submit="submitting = true"
        class="mt-4 sm:mt-5 space-y-3 sm:space-y-4">
        {% csrf_token %}
        
        <!-- Customer Selection Dropdown & Auto Fill -->
        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200" x-data="{
            selectedCustomerId: '{{ cart.customer_id|default:'' }}',
            customerName: '{{ cart.customer_name|default:'Walk-in Customer' }}',
            customerPhone: '{{ cart.customer_phone|default:'' }}',
            customerDue: '0.00',
            isNewCustomer: false,
            onCustomerChange(e) {
                const val = e.target.value;
                if (val === 'NEW') {
                    this.isNewCustomer = true;
                    this.selectedCustomerId = '';
                    this.customerName = '';
                    this.customerPhone = '';
                    this.customerDue = '0.00';
                    this.$nextTick(() => { document.getElementById('new-customer-name-field')?.focus(); });
                } else if (val === '') {
                    this.isNewCustomer = false;
                    this.selectedCustomerId = '';
                    this.customerName = 'Walk-in Customer';
                    this.customerPhone = '';
                    this.customerDue = '0.00';
                } else {
                    this.isNewCustomer = false;
                    this.selectedCustomerId = val;
                    const opt = e.target.selectedOptions[0];
                    this.customerName = opt.getAttribute('data-name') || '';
                    this.customerPhone = opt.getAttribute('data-phone') || '';
                    this.customerDue = opt.getAttribute('data-due') || '0.00';
                }
            }
        }">
            <div class="flex items-center justify-between mb-1.5">
                <label class="text-xs font-bold text-slate-800 flex items-center space-x-1.5">
                    <span>👤</span>
                    <span>কাস্টমার নির্বাচন (Customer Selection)</span>
                </label>
                <span class="text-[11px] text-slate-500 font-medium">ঐচ্ছিক • ডিফল্ট: সাধারণ ক্রেতা</span>
            </div>

            <!-- Customer Dropdown Selector -->
            <div class="relative">
                <select
                    @change="onCustomerChange($event)"
                    class="w-full bg-white border border-slate-300 focus:border-emerald-500 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-slate-800 font-bold focus:outline-none shadow-sm cursor-pointer">
                    <option value="" selected>👤 সাধারণ ক্রেতা (Walk-in Customer)</option>
                    {% if customers %}
                    <optgroup label="দোকানের রেজিস্টার্ড কাস্টমার তালিকা">
                        {% for c in customers %}
                        <option 
                            value="{{ c.id }}" 
                            data-name="{{ c.name }}" 
                            data-phone="{{ c.phone }}" 
                            data-due="{{ c.current_due }}">
                            {{ c.name }} ({{ c.phone }}){% if c.current_due > 0 %} — বকেয়া: ৳{{ c.current_due|floatformat:2 }}{% endif %}
                        </option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    <option value="NEW">➕ নতুন কাস্টমার এন্ট্রি করুন...</option>
                </select>
            </div>

            <!-- Hidden Fields for Form POST -->
            <input type="hidden" name="customer_id" :value="selectedCustomerId">
            <input type="hidden" name="customer_name" :value="customerName">
            <input type="hidden" name="customer_phone" :value="customerPhone">

            <!-- Selected Existing Customer Pill -->
            <div x-show="selectedCustomerId" x-cloak class="mt-2.5 p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">✓</span>
                    <div>
                        <span class="font-extrabold text-emerald-950" x-text="customerName"></span>
                        <span class="text-slate-500 font-mono text-[11px]" x-show="customerPhone" x-text="' (' + customerPhone + ')'"></span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[11px] font-bold" :class="parseFloat(customerDue) > 0 ? 'text-rose-600' : 'text-slate-500'" x-text="'বর্তমান বকেয়া: ৳' + customerDue"></span>
                </div>
            </div>

            <!-- New Customer Input Fields (shown only when 'NEW' is selected) -->
            <div x-show="isNewCustomer" x-cloak class="mt-2.5 pt-2.5 border-t border-slate-200 space-y-2">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-0.5">নতুন কাস্টমারের নাম *</label>
                        <input
                            type="text"
                            id="new-customer-name-field"
                            x-model="customerName"
                            placeholder="যেমন: মোঃ রফিকুল ইসলাম"
                            class="w-full bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-0.5">মোবাইল নম্বর (১১ ডিজিট)</label>
                        <input
                            type="tel"
                            x-model="customerPhone"
                            placeholder="017XXXXXXXX"
                            class="w-full bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-mono font-bold focus:border-emerald-500 focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <input type="hidden" name="payment_method" :value="parseFloat(paidAmount || 0) >= totalPayable ? 'CASH' : (parseFloat(paidAmount || 0) > 0 ? 'SPLIT' : 'DUE')">

        <!-- Cash received and change calculation -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">প্রাপ্ত টাকা (৳ Received)</label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="paid_amount" 
                    x-model="paidAmount"
                    class="w-full bg-white border-2 border-emerald-500 rounded-xl px-3 py-2 text-sm sm:text-base font-black text-emerald-700 font-mono focus:outline-none shadow-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ফেরত (Change ৳)</label>
                <div class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm sm:text-base font-black text-blue-700 font-mono" x-text="'৳' + changeAmount">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">বকেয়া (Due ৳)</label>
                <div class="w-full bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 text-sm sm:text-base font-black text-rose-700 font-mono" x-text="'৳' + dueAmount">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-between sm:justify-end space-x-2 sm:space-x-3 pt-3 sm:pt-4 border-t border-slate-100">
            <button 
                type="button" 
                @click="checkoutModalOpen = false; $dispatch('close-modal')"
                class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors cursor-pointer">
                বাতিল
            </button>
            <button 
                type="submit" 
                :disabled="submitting"
                :class="submitting ? 'opacity-50 cursor-not-allowed' : ''"
                class="px-5 sm:px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs sm:text-sm shadow-lg shadow-emerald-600/25 flex items-center space-x-2 transition-all active:scale-95 cursor-pointer">
                <span>কনফার্ম ও স্লিপ প্রিন্ট</span>
                <kbd class="hidden sm:inline-block px-1.5 py-0.5 rounded bg-emerald-800 text-xs font-mono">Enter</kbd>
            </button>
        </div>
    </form>
</div>

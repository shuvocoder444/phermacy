<div id="edit-batch-modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl border border-slate-200 pb-safe max-h-[90dvh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3.5 border-b border-slate-100">
            <div class="flex items-center space-x-2.5">
                <span class="text-xl">✏️</span>
                <div>
                    <h3 class="text-sm font-extrabold text-slate-800">স্টক ও ব্যাচ এডিট করুন</h3>
                    <p class="text-[11px] text-slate-500 font-medium">ব্যাচ নম্বর, মজুদ সংখ্যা বা মূল্য পরিবর্তন করুন</p>
                </div>
            </div>
            <button type="button" onclick="document.getElementById('edit-batch-modal-backdrop').remove()" class="text-slate-400 hover:text-slate-700 font-black text-xl p-1">
                &times;
            </button>
        </div>

        <form action="{% url 'inventory:edit_batch' batch.id %}" method="POST" class="mt-4 space-y-3.5">
            {% csrf_token %}

            <!-- Drug Overview (Read Only) -->
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                <div class="text-xs font-black text-slate-900">{{ batch.drug.brand_name }} ({{ batch.drug.strength }})</div>
                <div class="text-[11px] text-slate-500 mt-0.5">
                    {{ batch.drug.dosage_form.name }} • {{ batch.drug.generic.name }} • {{ batch.drug.manufacturer.name }}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ব্যাচ নম্বর *</label>
                    <input type="text" name="batch_number" value="{{ batch.batch_number }}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">মজুদ স্টক (পিস) *</label>
                    <input type="number" name="current_stock" value="{{ batch.current_stock }}" min="0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-emerald-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ক্রয়মূল্য (টাকা) *</label>
                    <input type="number" step="0.01" name="purchase_price" value="{{ batch.purchase_price }}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">বিক্রয়মূল্য (টাকা) *</label>
                    <input type="number" step="0.01" name="unit_mrp" value="{{ batch.unit_mrp }}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-emerald-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">মেয়াদের তারিখ *</label>
                    <input type="date" name="expiry_date" value="{{ batch.expiry_date|date:'Y-m-d' }}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">চালান নম্বর (ঐচ্ছিক)</label>
                    <input type="text" name="supplier_challan_no" value="{{ batch.supplier_challan_no|default:'' }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono" placeholder="যেমন: CH-8941">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="document.getElementById('edit-batch-modal-backdrop').remove()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition-colors">
                    বাতিল
                </button>
                <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-xs shadow-md shadow-emerald-600/25 active:scale-95 transition-all">
                    সংরক্ষণ করুন 💾
                </button>
            </div>
        </form>
    </div>
</div>

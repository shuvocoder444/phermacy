<!-- Instant Stock Inward (নতুন ব্যাচ স্টক ইন) Modal Component -->
<div 
    id="stock-in-modal-container"
    x-data="stockInController()"
    x-show="isOpen"
    x-cloak
    @open-stock-in.window="openModal($event.detail)"
    class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 select-none">
    
    <div 
        @click.outside="closeModal()"
        class="bg-white rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl max-w-xl w-full overflow-hidden max-h-[92vh] flex flex-col pb-safe">
        
        <!-- Modal Header -->
        <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-teal-50 via-emerald-50 to-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-lg font-black shadow-md shadow-teal-600/20">
                    📦
                </div>
                <div>
                    <h3 class="font-extrabold text-slate-800 text-base">নতুন ব্যাচ স্টক ইনওয়ার্ড (Stock In)</h3>
                    <p class="text-xs text-slate-500 font-medium">সাপ্লায়ার চালান বা ক্রয় অনুযায়ী ঔষধের স্টক সিস্টেমে এন্ট্রি দিন</p>
                </div>
            </div>
            <button 
                type="button" 
                @click="closeModal()" 
                class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center text-sm transition-colors">
                ✕
            </button>
        </div>

        <!-- Success Toast Notification -->
        <div x-show="successMsg" x-transition class="mx-4 mt-3 p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span>🎉</span>
                <span x-text="successMsg"></span>
            </div>
            <button @click="successMsg = ''" class="text-emerald-700 font-bold hover:text-emerald-900">&times;</button>
        </div>

        <!-- Error Notification -->
        <div x-show="errorMsg" x-transition class="mx-4 mt-3 p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span>⚠️</span>
                <span x-text="errorMsg"></span>
            </div>
            <button @click="errorMsg = ''" class="text-rose-700 font-bold hover:text-rose-900">&times;</button>
        </div>

        <!-- Form Body -->
        <form @submit.prevent="submitForm(false)" class="p-4 sm:p-6 overflow-y-auto space-y-4">
            
            <!-- 1. Live Medicine Autocomplete Search -->
            <div class="relative">
                <label class="block text-xs font-bold text-slate-700 mb-1">
                    ঔষধের নাম (Brand Name) <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm pointer-events-none">💊</span>
                    <input 
                        type="text" 
                        x-model="brandName"
                        x-ref="brandInput"
                        @input.debounce.250ms="searchDrugs()"
                        @focus="if(results.length > 0) showDropdown = true"
                        placeholder="ঔষধের নাম লিখুন (যেমন: Napa, Sergel 20, Ace, Maxpro)..." 
                        required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-8 py-2.5 text-xs sm:text-sm font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all">
                    
                    <button 
                        type="button" 
                        x-show="brandName" 
                        @click="clearSelectedDrug()"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 text-xs font-black">
                        ✕
                    </button>
                </div>

                <!-- Autocomplete Dropdown List -->
                <div 
                    x-show="showDropdown && results.length > 0"
                    @click.outside="showDropdown = false"
                    class="absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-56 overflow-y-auto divide-y divide-slate-100">
                    <template x-for="drug in results" :key="drug.id">
                        <div 
                            @click="selectDrug(drug)"
                            class="p-2.5 px-3 hover:bg-teal-50/80 cursor-pointer transition-colors flex items-center justify-between">
                            <div class="truncate pr-2">
                                <div class="flex items-center space-x-1.5">
                                    <span class="font-extrabold text-xs text-slate-800" x-text="drug.brand_name"></span>
                                    <span class="text-[10px] px-1 py-0.2 bg-slate-100 text-slate-600 rounded font-mono font-bold" x-text="drug.strength"></span>
                                    <span class="text-[10px] text-slate-400" x-text="drug.dosage_form"></span>
                                </div>
                                <div class="text-[10px] text-slate-500 truncate" x-text="drug.generic + ' • ' + drug.manufacturer"></div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-xs font-mono font-bold text-emerald-700" x-text="'MRP ৳' + drug.unit_mrp"></div>
                                <div class="text-[10px] font-mono text-slate-400" x-text="'TP ৳' + drug.unit_tp"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Selected Drug Details Pill -->
                <template x-if="selectedDrug">
                    <div class="mt-1.5 p-2 bg-teal-50/70 border border-teal-200 rounded-xl flex items-center justify-between text-xs">
                        <div class="truncate text-teal-900 font-medium">
                            <strong x-text="selectedDrug.brand_name"></strong>
                            <span class="text-slate-600 text-[11px]" x-text="' (' + selectedDrug.generic + ' - ' + selectedDrug.manufacturer + ')'"></span>
                        </div>
                        <span class="text-[10px] bg-teal-200/70 text-teal-800 px-1.5 py-0.5 rounded font-mono font-bold shrink-0">ক্যাটালগ ম্যাচ</span>
                    </div>
                </template>
            </div>

            <!-- 2. Batch Number & Smart Auto Generator -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-bold text-slate-700">
                            ব্যাচ নম্বর (Batch No) <span class="text-rose-500">*</span>
                        </label>
                        <button 
                            type="button" 
                            @click="generateAutoBatch()"
                            class="text-[10px] text-teal-700 font-bold hover:underline flex items-center space-x-0.5">
                            <span>⚡ অটো ব্যাচ</span>
                        </button>
                    </div>
                    <input 
                        type="text" 
                        x-model="batchNumber"
                        required 
                        placeholder="e.g. B26-1049 বা SQ-8902" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>

                <!-- 3. Expiry Date & 1-Click Presets -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-bold text-slate-700">
                            মেয়াদোত্তীর্ণের তারিখ <span class="text-rose-500">*</span>
                        </label>
                        <div class="flex items-center space-x-1">
                            <button type="button" @click="setExpiryYears(1)" class="text-[9px] px-1 py-0.5 bg-slate-100 hover:bg-teal-100 rounded text-slate-700 font-bold">+১ বঃ</button>
                            <button type="button" @click="setExpiryYears(2)" class="text-[9px] px-1 py-0.5 bg-teal-100 hover:bg-teal-200 rounded text-teal-800 font-bold">+২ বঃ</button>
                            <button type="button" @click="setExpiryYears(3)" class="text-[9px] px-1 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold">+৩ বঃ</button>
                        </div>
                    </div>
                    <input 
                        type="date" 
                        x-model="expiryDate"
                        required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
            </div>

            <!-- 4. Stock Quantity with Instant Steppers -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                    স্টক সংখ্যা (Inward Quantity - পিস) <span class="text-rose-500">*</span>
                </label>
                <div class="flex items-center space-x-2">
                    <button 
                        type="button" 
                        @click="quantity = Math.max(1, parseInt(quantity || 0) - 10)"
                        class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-sm flex items-center justify-center active:scale-95">
                        -10
                    </button>
                    <button 
                        type="button" 
                        @click="quantity = Math.max(1, parseInt(quantity || 0) - 1)"
                        class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-sm flex items-center justify-center active:scale-95">
                        -1
                    </button>
                    <input 
                        type="number" 
                        x-model="quantity"
                        required 
                        min="1" 
                        class="flex-1 bg-white border border-slate-300 rounded-xl px-3 py-2 text-center text-sm font-black font-mono text-teal-700 focus:ring-2 focus:ring-teal-500 focus:outline-none shadow-inner">
                    <button 
                        type="button" 
                        @click="quantity = parseInt(quantity || 0) + 1"
                        class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-sm flex items-center justify-center active:scale-95">
                        +1
                    </button>
                    <button 
                        type="button" 
                        @click="quantity = parseInt(quantity || 0) + 10"
                        class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-sm flex items-center justify-center active:scale-95">
                        +10
                    </button>
                </div>
                
                <!-- Quick Quantity Preset Chips -->
                <div class="flex items-center space-x-1.5 mt-1.5 overflow-x-auto no-scrollbar">
                    <span class="text-[10px] text-slate-400 font-bold shrink-0">কুইক সিলেক্ট:</span>
                    <button type="button" @click="quantity = 50" class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono font-bold">50</button>
                    <button type="button" @click="quantity = 100" class="text-[10px] px-2 py-0.5 rounded-lg bg-teal-100 hover:bg-teal-200 text-teal-800 font-mono font-bold">100</button>
                    <button type="button" @click="quantity = 200" class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono font-bold">200</button>
                    <button type="button" @click="quantity = 500" class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono font-bold">500</button>
                    <button type="button" @click="quantity = 1000" class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono font-bold">1000</button>
                </div>
            </div>

            <!-- 5. TP & MRP Pricing Breakdown -->
            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">
                        কেনা দর (Trade Price TP ৳)
                    </label>
                    <input 
                        type="number" 
                        step="0.01" 
                        x-model="purchasePrice"
                        placeholder="8.20" 
                        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold text-slate-800 text-right focus:border-teal-500 focus:outline-none">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[11px] font-bold text-slate-700">
                            খুচরা বিক্রয় দর (MRP ৳)
                        </label>
                        <span 
                            x-show="profitMargin > 0" 
                            class="text-[9px] px-1 py-0.2 rounded bg-emerald-100 text-emerald-800 font-mono font-bold" 
                            x-text="'লাভ ' + profitMargin + '%'">
                        </span>
                    </div>
                    <input 
                        type="number" 
                        step="0.01" 
                        x-model="unitMrp"
                        placeholder="10.00" 
                        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold text-emerald-700 text-right focus:border-teal-500 focus:outline-none">
                </div>
            </div>

            <!-- 6. Supplier Challan / Voucher No -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">সাপ্লায়ার চালান / ভাউচার নম্বর (ঐচ্ছিক)</label>
                <input 
                    type="text" 
                    x-model="challanNo"
                    placeholder="e.g. SQ-CHALLAN-8890 বা ইনভয়েস নং" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:bg-white focus:border-teal-500 focus:outline-none">
            </div>

            <!-- Modal Action Buttons -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                <button 
                    type="button" 
                    @click="closeModal()" 
                    class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">
                    বাতিল
                </button>
                
                <div class="flex items-center space-x-2">
                    <button 
                        type="button" 
                        @click="submitForm(true)"
                        :disabled="isSubmitting"
                        class="px-3.5 py-2.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 border border-teal-200 font-bold text-xs transition-all active:scale-95 flex items-center space-x-1">
                        <span>➕</span>
                        <span>সেভ ও পরবর্তী আইটেম</span>
                    </button>
                    
                    <button 
                        type="submit" 
                        :disabled="isSubmitting"
                        class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-teal-600 via-emerald-600 to-teal-700 hover:from-teal-500 hover:to-emerald-500 text-white font-extrabold text-xs shadow-md shadow-teal-600/25 transition-all active:scale-95 flex items-center space-x-1.5 cursor-pointer">
                        <span x-show="!isSubmitting">⚡ স্টক সেভ করুন</span>
                        <span x-show="isSubmitting">সংরক্ষণ হচ্ছে...</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Stock Inward Alpine Controller Script -->
<script>
function stockInController() {
    return {
        isOpen: false,
        brandName: '',
        drugId: '',
        selectedDrug: null,
        batchNumber: '',
        expiryDate: '',
        quantity: 100,
        purchasePrice: '',
        unitMrp: '',
        challanNo: '',
        results: [],
        showDropdown: false,
        isSubmitting: false,
        successMsg: '',
        errorMsg: '',

        init() {
            this.generateAutoBatch();
            this.setExpiryYears(2);
        },

        get profitMargin() {
            const mrp = parseFloat(this.unitMrp);
            const tp = parseFloat(this.purchasePrice);
            if (mrp > 0 && tp > 0 && mrp > tp) {
                return (((mrp - tp) / mrp) * 100).toFixed(1);
            }
            return 0;
        },

        openModal(initialData) {
            this.isOpen = true;
            this.successMsg = '';
            this.errorMsg = '';
            if (initialData && initialData.brandName) {
                this.brandName = initialData.brandName;
                this.searchDrugs();
            }
            this.$nextTick(() => {
                this.$refs.brandInput?.focus();
            });
        },

        closeModal() {
            this.isOpen = false;
            // Also notify parent if needed
            if (typeof addBatchModalOpen !== 'undefined') {
                try { addBatchModalOpen = false; } catch(e){}
            }
        },

        generateAutoBatch() {
            const now = new Date();
            const yy = now.getFullYear().toString().slice(-2);
            const mm = (now.getMonth() + 1).toString().padStart(2, '0');
            const rand = Math.floor(1000 + Math.random() * 9000);
            this.batchNumber = `B${yy}-${mm}${rand}`;
        },

        setExpiryYears(years) {
            const d = new Date();
            d.setFullYear(d.getFullYear() + years);
            this.expiryDate = d.toISOString().split('T')[0];
        },

        async searchDrugs() {
            const q = this.brandName.trim();
            if (!q) {
                this.results = [];
                this.showDropdown = false;
                return;
            }
            try {
                const res = await fetch(`/inventory/autocomplete/?q=${encodeURIComponent(q)}`);
                if (res.ok) {
                    const data = await res.json();
                    this.results = data.results || [];
                    this.showDropdown = this.results.length > 0;
                }
            } catch(e) {
                this.results = [];
            }
        },

        selectDrug(drug) {
            this.selectedDrug = drug;
            this.brandName = drug.brand_name;
            this.drugId = drug.id;
            this.unitMrp = drug.unit_mrp;
            this.purchasePrice = drug.unit_tp;
            this.showDropdown = false;
        },

        clearSelectedDrug() {
            this.brandName = '';
            this.drugId = '';
            this.selectedDrug = null;
            this.results = [];
            this.showDropdown = false;
        },

        async submitForm(continueAdding) {
            if (!this.brandName || !this.batchNumber || !this.expiryDate) {
                this.errorMsg = 'ঔষধের নাম, ব্যাচ নম্বর এবং মেয়াদোত্তীর্ণের তারিখ পূরণ করুন!';
                return;
            }

            this.isSubmitting = true;
            this.errorMsg = '';
            this.successMsg = '';

            const formData = new FormData();
            formData.append('brand_name', this.brandName);
            formData.append('drug_id', this.drugId || '');
            formData.append('batch_number', this.batchNumber);
            formData.append('expiry_date', this.expiryDate);
            formData.append('quantity', this.quantity || 100);
            formData.append('purchase_price', this.purchasePrice || '');
            formData.append('unit_mrp', this.unitMrp || '');
            formData.append('challan_no', this.challanNo || '');
            formData.append('is_ajax', '1');

            // CSRF token lookup
            let csrfToken = '';
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            if (csrfInput) {
                csrfToken = csrfInput.value;
            } else {
                const match = document.cookie.match(/csrftoken=([^;]+)/);
                if (match) csrfToken = match[1];
            }
            if (csrfToken) formData.append('csrfmiddlewaretoken', csrfToken);

            try {
                const res = await fetch('/inventory/add-batch/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    }
                });

                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    // Play audio beep / chime
                    if (typeof playCartAddSound === 'function') {
                        playCartAddSound();
                    }

                    this.successMsg = data.message || 'স্টক সফলভাবে ইনওয়ার্ড হয়েছে!';
                    
                    if (continueAdding) {
                        // Reset for next medicine
                        this.clearSelectedDrug();
                        this.generateAutoBatch();
                        this.quantity = 100;
                        this.$refs.brandInput?.focus();
                    } else {
                        setTimeout(() => {
                            this.closeModal();
                            // Refresh inventory table if on inventory page
                            if (window.location.pathname.includes('/inventory')) {
                                window.location.reload();
                            }
                        }, 900);
                    }
                } else {
                    this.errorMsg = data.message || 'স্টক যোগ করতে ত্রুটি হয়েছে।';
                }
            } catch(e) {
                this.errorMsg = 'সার্ভার যোগাযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
            } finally {
                this.isSubmitting = false;
            }
        }
    };
}
</script>
